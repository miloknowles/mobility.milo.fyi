name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Check out Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Build site
        working-directory: quartz
        run: |
          npm ci
          rm -rf content && mkdir content
          rsync -a --exclude '.git' --exclude '.github' --exclude '.obsidian' ../vault/ content/
          if [ -f ../vault/quartz.config.ts ]; then cp ../vault/quartz.config.ts .; fi
          if [ -f ../vault/quartz.layout.ts ]; then cp ../vault/quartz.layout.ts .; fi
          npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
